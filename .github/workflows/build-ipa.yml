name: Build LocationControl IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App Binary
        run: |
          cd LocationControl
          
          # Get the official iOS SDK path
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Targeting SDK: $IPHONEOS_SDK"
          
          # Clean any previous artifacts
          rm -rf .build ../build
          
          # Compile with swift build passing --sdk directly to SwiftPM
          swift build -c release \
            --sdk "$IPHONEOS_SDK" \
            --triple arm64-apple-ios17.0
          
          # Create IPA Payload structure
          mkdir -p ../build/Payload/LocationControl.app
          APP_DIR="../build/Payload/LocationControl.app"
          
          # Copy compiled binary
          BINARY=$(find .build/arm64-apple-ios17.0/release -type f -name "LocationControlApp" | head -n 1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find .build -type f -name "LocationControlApp" | head -n 1)
          fi
          echo "Found binary at: $BINARY"
          cp "$BINARY" "$APP_DIR/LocationControl"
          chmod +x "$APP_DIR/LocationControl"
          
          # Generate standard Info.plist
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LocationControl</string>
              <key>CFBundleIdentifier</key>
              <string>com.locationcontrol.suite</string>
              <key>CFBundleName</key>
              <string>LocationControl</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>LocationControl requires location permissions to display and simulate driving routes.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>LocationControl simulates virtual routes in background sessions.</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Package into IPA
        run: |
          cd build
          zip -r LocationControl.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationControl-IPA
          path: build/LocationControl.ipa
          retention-days: 14
